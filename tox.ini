# Tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported Python versions. To use it,
# "pip install tox" and then run "tox" from this directory.

[tox]
envlist = py310, py311, py312, py313, py314, py315, pypy311, mypy

[testenv]
package = wheel
wheel_build_env = .pkg
commands =
    python -m unittest discover {posargs}

[testenv:mypy]
extras = mypy
commands =
    python -m mypy --strict --exclude lazy/tests {posargs} lazy
    python lazy/examples/example.py

[testenv:docs]
extras = docs
commands =
    python -m sphinx -a -d docs/_build/doctrees {posargs} docs docs/_build/html

[pytest]
testpaths = lazy/tests
